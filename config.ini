; [base] ruta: archivo de la base. Relativa a la carpeta del programa o absoluta,
;   por ejemplo: \\PC-TALLER\Mantenimiento\mantenimiento.db
; [respaldo] carpeta: vacío = subcarpeta 'respaldos' junto a la base. dias: copias a conservar.
; [app] refresco_seg: cada cuántos segundos se buscan cambios de otros usuarios (0 = nunca).

[base]
ruta = mantenimiento.db

[respaldo]
carpeta = 
dias = 30

[app]
refresco_seg = 30

[plan]
tolerancia_dias = 3
anticipacion_orden_dias = 15

